name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --ignore-scripts
      - name: Prepare pinned YAML cache for offline package test
        shell: pwsh
        run: npm cache add yaml@2.9.0 --ignore-scripts --no-audit --no-fund
      - name: Run the complete test suite
        shell: pwsh
        run: npm test
      - name: Verify the exact package allowlist
        shell: pwsh
        run: npm pack --dry-run --json
      - name: Audit production dependencies
        shell: pwsh
        run: npm audit --omit=dev
